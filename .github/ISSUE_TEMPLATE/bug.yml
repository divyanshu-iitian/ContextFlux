name: Bug report
description: Report a reproducible ContextFlux defect
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include the command, task, relevant file layout, and sanitized output.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ContextFlux and Node.js versions
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Data check
      options:
        - label: I removed secrets and proprietary source from this report.
          required: true
